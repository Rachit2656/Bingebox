<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BINGEBOX – Series and Movies</title>
<style>
:root{--bg:#141414;--fg:#fff;--mut:#b3b3b3;--red:#e50914;--card:#181818;--line:#333;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;padding:12px 4%;padding-top:calc(12px + env(safe-area-inset-top,0px));background:linear-gradient(#000d,transparent);transition:background .3s}
nav.solid{background:var(--bg)}
.logo{color:var(--red);font:900 clamp(22px,3vw,32px)/1 Impact,"Arial Black",sans-serif;letter-spacing:1px}
.links{display:flex;gap:16px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.links button{font-size:14px;color:#e5e5e5}
.links button.on{font-weight:700;color:#fff}
.links button:hover{color:var(--mut)}
.sw{display:flex;align-items:center;border:1px solid transparent}
.sw.open{border-color:#fff;background:#000a}
#q{width:0;padding:0;border:0;background:none;color:#fff;font:inherit;outline:0;transition:width .3s}
.open #q{width:min(200px,36vw);padding:6px 8px}
#sb{padding:6px}
.av{width:32px;height:32px;border-radius:4px;background:var(--red);font-size:18px}
#hero{position:relative;height:min(85vh,760px);min-height:460px;display:flex;align-items:flex-end;padding:0 4% 12vh;background:linear-gradient(90deg,#000a,transparent 60%),radial-gradient(circle at 78% 35%,hsl(var(--b) 90% 55%/.8),transparent 45%),linear-gradient(120deg,hsl(var(--a) 60% 26%),hsl(var(--b) 70% 8%));overflow:hidden}
#hero::after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,var(--bg))}
.big{position:absolute;right:10%;top:20%;font-size:clamp(100px,22vw,260px);opacity:.55;filter:drop-shadow(0 10px 30px #0008)}
.hc{position:relative;z-index:1;max-width:560px}
.hc small{font-weight:700;letter-spacing:3px;color:#ffffffcc}
h1{font-size:clamp(34px,6vw,72px);font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:1px;text-shadow:0 3px 12px #0008}
.hc p{margin:14px 0 20px;font-size:clamp(14px,1.6vw,20px);text-shadow:0 2px 6px #0008}
.btn{padding:10px 24px;border-radius:4px;font-weight:700;font-size:clamp(14px,1.5vw,18px);margin-right:10px;transition:opacity .2s}
.btn:hover{opacity:.8}
.w{background:#fff;color:#000}
.g{background:#6d6d6eb3}
.ic{width:40px;height:40px;border-radius:50%;border:2px solid #fff6;background:#2a2a2a99;font-size:18px;margin-right:8px}
.ic:hover{border-color:#fff}
.ic.on{background:#fff;color:#000}
.row:first-child{margin-top:-60px;position:relative;z-index:2}
.row h2{font-size:clamp(16px,1.6vw,22px);font-weight:700;padding:0 4%;margin-top:14px}
.wrap{position:relative}
.track{display:flex;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:28px 4%}
.arr{position:absolute;top:28px;bottom:28px;width:4%;min-width:34px;background:#000a;font-size:34px;opacity:0;z-index:3;transition:opacity .2s}
.wrap:hover .arr{opacity:1}
.arr.l{left:0}.arr.r{right:0}
@media (hover:none){.arr{display:none}}
.card{flex:0 0 clamp(120px,15vw,190px);aspect-ratio:2/3;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;text-align:left;background:radial-gradient(circle at 75% 18%,hsl(var(--b) 90% 62%/.85),transparent 50%),linear-gradient(160deg,hsl(var(--a) 65% 32%),hsl(var(--b) 70% 10%));transition:transform .25s,box-shadow .25s}
.card:hover{transform:scale(1.12);z-index:2;box-shadow:0 10px 30px #000c}
.card .em{font-size:clamp(40px,5vw,60px);text-align:center;margin-top:18%;filter:drop-shadow(0 4px 8px #0006)}
.card small{font-size:10px;letter-spacing:2px;color:#ffffffbb}
.card b{display:block;font:800 clamp(13px,1.3vw,17px)/1.1 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 2px 6px #000a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:100px 4% 40px;min-height:70vh}
.grid .card{width:100%}
.grid p,.mut{color:var(--mut)}
footer{text-align:center;padding:40px 4% 50px;color:var(--mut);font-size:13px}
footer button{display:block;margin:0 auto 14px;color:#fff;font-weight:700}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:5vh 12px;padding-top:calc(5vh + env(safe-area-inset-top,0px))}
.box{background:var(--card);width:min(850px,100%);border-radius:10px;overflow:hidden;position:relative}
.art{position:relative;height:340px;display:flex;align-items:flex-end;padding:24px;background:radial-gradient(circle at 75% 30%,hsl(var(--b) 90% 55%/.8),transparent 50%),linear-gradient(130deg,hsl(var(--a) 60% 26%),hsl(var(--b) 70% 8%))}
.art::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,var(--card))}
.art .big{right:8%;top:12%;font-size:150px}
.ac{position:relative;z-index:1}
.ac h1{font-size:clamp(28px,5vw,48px);margin-bottom:14px}
.x{position:absolute;top:12px;right:12px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:16px}
.info{padding:8px 24px 28px}
.info p{margin-top:12px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gr{color:#46d369}
.rt{border:1px solid #fff6;padding:0 6px;font-size:12px}
.info h3{margin:22px 0 6px;font-size:20px}
.ep{display:flex;gap:14px;align-items:center;width:100%;padding:14px;border-bottom:1px solid var(--line);text-align:left}
.ep:hover{background:#2a2a2a}
.ep b{font-size:22px;color:var(--mut);width:28px}
.ep span{flex:1}
.ep small{display:block;color:var(--mut)}
#p{padding:0;align-items:stretch;background:#000;z-index:60;overflow:hidden}
.pl{width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 45%,hsl(var(--b) 80% 40%/.7),transparent 55%),linear-gradient(hsl(var(--a) 50% 12%),#000)}
.pt{display:flex;align-items:center;gap:14px;font-size:18px;font-weight:700}
.pt button{font-size:26px;padding:4px 10px}
.mid{display:flex;flex-direction:column;align-items:center;gap:20px}
.pa{font-size:clamp(90px,20vw,200px);line-height:1}
.run .pa{animation:pu 2s ease-in-out infinite alternate}
@keyframes pu{to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.run .pa{animation:none}}
#pp{width:72px;height:72px;border-radius:50%;border:2px solid #fff;background:#fff2;font-size:28px}
#pb{height:6px;background:#fff4;border-radius:3px;cursor:pointer;margin-bottom:10px}
#pb i{display:block;height:100%;width:0;background:var(--red);border-radius:3px}
.pr{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
#t{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 18px;border-radius:4px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:80}
#t.on{opacity:1;transform:translate(-50%,0)}
.card{position:relative;overflow:hidden}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.has>span{display:none}
.pimg{position:absolute;right:8%;top:14%;height:72%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 20px 50px #000a}
@media(max-width:700px){.pimg{opacity:.35}}
.gear{background:#333}
.ad{padding:24px}
.ad h2{font-size:22px;margin-bottom:12px}
.ad input,.ad select,.ad textarea{width:100%;padding:8px;margin:4px 0 10px;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:4px;font:inherit}
.ad .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ad label{font-size:13px;color:var(--mut)}
.ad .btn{margin:6px 8px 0 0}
.ar{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ar img,.ar i{width:34px;height:50px;object-fit:cover;border-radius:3px;background:#333;flex:none}
.ar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar button{padding:6px 10px;background:#333;border-radius:4px;font-size:13px}
.si{background:var(--red);padding:6px 16px;margin:0;font-size:14px}
.lk{text-decoration:underline;color:#fff}
.ad h3{margin:14px 0 4px;font-size:16px}
.er{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.er input{margin-bottom:6px}
.er button{padding:4px 10px;background:#333;border-radius:4px}
#pv{flex:1;min-height:0;width:100%;background:#000;border-radius:6px;margin:10px 0}
</style>
</head>
<body>
<nav>
<button class="logo" data-v="home" aria-label="BINGEBOX home">BINGEBOX</button>
<div class="links">
<button data-v="home">Home</button><button data-v="series">Series</button><button data-v="movies">Movies</button><button data-v="new">New and Popular</button><button data-v="list">My List</button>
</div>
<div id="sw" class="sw"><input id="q" placeholder="Titles, genres" aria-label="Search titles"><button id="sb" aria-label="Search">🔍</button></div>
<button id="si" class="btn si">Sign In</button><button id="av" class="av" aria-label="Account" hidden></button>
</nav>
<header id="hero"></header>
<main id="main"></main>
<footer><button data-top>Back to top ↑</button>BINGEBOX is a demo project with made-up titles. It is not connected to any real streaming service.</footer>
<div id="m" class="ov" hidden><div class="box"></div></div>
<div id="p" class="ov" hidden>
<div class="pl">
<div class="pt"><button data-pc aria-label="Close player">←</button><span id="pt"></span></div>
<video id="pv" controls playsinline hidden></video><div class="mid"><span id="pa" class="pa"></span><button id="pp" aria-label="Play or pause">⏸</button></div>
<div id="dc"><div id="pb"><i></i></div><div class="pr"><span id="tm"></span><span>Demo player, no real video</span></div></div>
</div>
</div>
<div id="a" class="ov" hidden><div class="box ad" id="ab"></div></div><div id="t" role="status"></div>
<script>
const D=[
["Neon Syndicate","s","🌆",290,330,2025,"U/A 16+","Sci-Fi","3 Seasons","A crew of hackers takes on a city run by algorithms."],
["The Last Monsoon","s","🌧️",200,230,2024,"U/A 13+","Drama","2 Seasons","A family fights to save their village when the rains stop coming."],
["Dark Harbor","s","⚓",210,190,2026,"A","Thriller","4 Seasons","A detective returns to a port town where every secret has a price."],
["Campus Chaos","s","🎒",40,10,2026,"U/A 13+","Comedy","5 Seasons","Five hostel friends. One impossible semester."],
["Crown of Embers","s","🔥",15,35,2025,"U/A 16+","Fantasy","2 Seasons","Three heirs, one throne and a kingdom about to burn."],
["Mumbai Nights","s","🌃",260,300,2026,"A","Crime","3 Seasons","A cab driver is dragged into the deadliest night of the city."],
["Heartline","s","💌",340,320,2025,"U/A 13+","Romance","1 Season","Letters connect two strangers living in two different cities."],
["Void Station","s","🛰️",180,250,2024,"U/A 16+","Sci-Fi","2 Seasons","A crew stranded on a silent space station hears a voice."],
["Spice Route","s","🌶️",25,5,2025,"U/A 7+","Comedy","3 Seasons","A food truck family chases fame across India."],
["Royal Lies","s","👑",45,330,2026,"A","Drama","1 Season","Behind palace walls, everyone is hiding something."],
["Iron Horizon","m","🚁",205,220,2026,"U/A 16+","Action","2h 18m","An ex-pilot has 24 hours to stop a sky-high heist."],
["Silent Verdict","m","⚖️",230,270,2025,"A","Thriller","2h 3m","A lawyer defends a client who refuses to say a word."],
["Love in Lisbon","m","🌹",350,320,2025,"U/A 13+","Romance","1h 52m","Two travellers, one missed train and a city made for second chances."],
["Galaxy Gang","m","🚀",270,190,2024,"U/A 7+","Comedy","1h 40m","Four clumsy cadets accidentally save the universe."],
["Shadow Protocol","m","🕶️",220,200,2026,"U/A 16+","Action","2h 11m","A retired agent is pulled back in by a message from his past."],
["The Paper Moon","m","🌙",250,290,2024,"U/A 13+","Drama","1h 58m","A shy painter and a night-shift nurse find hope in small things."],
["Rapid Fire","m","⚡",50,15,2025,"U/A 16+","Action","2h 5m","One highway, one convoy and sixty minutes to reach the border."],
["Ghost Wedding","m","👻",280,320,2026,"U/A 13+","Comedy","1h 47m","A haunted haveli hosts the funniest wedding of the year."],
["Deep Blue","m","🌊",195,225,2025,"U/A 13+","Sci-Fi","2h 22m","Scientists find a signal at the bottom of the ocean."],
["Desert Kings","m","🐪",35,20,2024,"U/A 13+","Action","2h 30m","Rival caravans race across the dunes for a legendary treasure."]
];
const DEF=D.map((d,i)=>({i,n:d[0],s:d[1]==="s",e:d[2],a:d[3],b:d[4],y:d[5],r:d[6],g:d[7],l:d[8],d:d[9],tr:[0,2,3,4,5,10,11,12,14,15].includes(i)}));
const E=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
const norm=d=>({i:+d.i,n:E(d.n),s:!!d.s,e:E(d.e||"🎬"),a:+d.a||0,b:+d.b||0,y:+d.y||2026,r:E(d.r),g:E(d.g),l:E(d.l),d:E(d.d),tr:!!d.tr,hero:!!d.hero,p:/^[0-9a-f]{32}$/.test(d.p||"")?d.p:"",o:d});
let T=DEF.map(norm),db,assets,adm=false,uid="",ok=false,acct=null,S="";
const get=i=>T.find(t=>t.i===i)||T[0];

const R=[["Trending Now",t=>t.tr],["Popular Web Series",t=>t.s],["Blockbuster Movies",t=>!t.s],["Sci-Fi and Fantasy",t=>/Sci|Fan/.test(t.g)],["Comedy Hits",t=>t.g==="Comedy"],["Action and Thrillers",t=>/Act|Thr|Cri/.test(t.g)],["Romance and Drama",t=>/Rom|Dra/.test(t.g)],["All Titles",()=>true]];
const RN=[["New Releases",t=>t.y>=2026],R[0]];
const P=[["You","#e50914"],["Kids","#1e88e5"],["Guest","#43a047"],["Family","#fb8c00"]];
const $=s=>document.querySelector(s);
let view="home",prev="home",L=[],timer,pos=0,len=1,pi=0,tt;
try{S=localStorage.getItem("bbs")||""}catch(e){}
const LK=()=>"bb"+S;
const loadL=()=>{try{L=JSON.parse(localStorage.getItem(LK())||"[]")}catch(e){L=[]}};
loadL();
const sv=()=>{try{localStorage.setItem(LK(),JSON.stringify(L))}catch(e){}};
const hs=t=>"--a:"+t.a+";--b:"+t.b;
const card=t=>`<button class="card${t.p?" has":""}" data-id="${t.i}" style="${hs(t)}" aria-label="${t.n}">${t.p?`<img src="/_blob/${t.p}" alt="" loading="lazy">`:""}<span class="em">${t.e}</span><span><small>${t.s?"SERIES":"FILM"}</small><b>${t.n}</b></span></button>`;
const fm=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(c).padStart(2,"0")};
function toast(s){const e=$("#t");e.textContent=s;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2000)}
function render(){
const v=view,f=v==="series"?t=>t.s:v==="movies"?t=>!t.s:()=>true;
document.querySelectorAll(".links [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
const pk=v==="movies"?T.filter(t=>!t.s):v==="series"?T.filter(t=>t.s):T,ht=pk.find(x=>x.hero)||pk[0],sh=["home","series","movies"].includes(v)&&!!ht;
$("#hero").hidden=!sh;
if(sh){const t=ht;$("#hero").style.cssText=hs(t);$("#hero").innerHTML=(t.p?`<img class="pimg" src="/_blob/${t.p}" alt="">`:`<span class="big">${t.e}</span>`)+`<div class="hc"><small>${t.s?"WEB SERIES":"MOVIE"}</small><h1>${t.n}</h1><p>${t.d}</p><div><button class="btn w" data-play="${t.i}">▶ Play</button><button class="btn g" data-id="${t.i}">ⓘ More Info</button></div></div>`}
let h="";
if(v==="list"||v==="search"){
const q=$("#q").value.trim().toLowerCase();
const a=v==="list"?T.filter(t=>L.includes(t.i)):T.filter(t=>(t.n+" "+t.g+" "+(t.s?"series":"movie")).toLowerCase().includes(q));
h=`<div class="grid">${a.length?a.map(card).join(""):"<p>"+(v==="list"?"Your list is empty. Open any title and tap ＋ to save it here.":"No titles found. Try another name or genre.")+"</p>"}</div>`;
}else{
h=(v==="new"?RN:R).map(([n,p])=>{const a=T.filter(t=>p(t)&&f(t));return a.length?`<section class="row"><h2>${n}</h2><div class="wrap"><button class="arr l" aria-label="Scroll left">‹</button><div class="track">${a.map(card).join("")}</div><button class="arr r" aria-label="Scroll right">›</button></div></section>`:""}).join("");
if(v==="new")h='<div style="height:90px"></div>'+h;
}
$("#main").innerHTML=h;
}
function openM(i){
const t=get(i),on=L.includes(i);
let ep="";
if(t.s){ep="<h3>Episodes</h3>";const es=t.o.eps||[];for(let k=1;k<=(es.length||6);k++)ep+=`<button class="ep" data-play="${i}" data-ep="${k}"><b>${k}</b><span>${E((es[k-1]||{}).t||"Episode "+k)}<small>${40+(i*7+k*3)%15} min</small></span><em>▶</em></button>`}
$("#m .box").innerHTML=`<div class="art" style="${hs(t)}">${t.p?`<img class="pimg" src="/_blob/${t.p}" alt="">`:`<span class="big">${t.e}</span>`}<button class="x" data-x aria-label="Close">✕</button><div class="ac"><h1>${t.n}</h1><div><button class="btn w" data-play="${i}">▶ Play</button><button class="ic${on?" on":""}" data-list="${i}" title="My List" aria-label="Add to My List">${on?"✓":"＋"}</button><button class="ic" data-like title="I like this" aria-label="Like">👍</button></div></div></div><div class="info"><p class="meta"><b class="gr">${90+i%9}% Match</b><span>${t.y}</span><span class="rt">${t.r}</span><span>${t.l}</span><span class="rt">HD</span></p><p>${t.d}</p><p class="mut">Genre: ${t.g}. Type: ${t.s?"Web series":"Movie"}.</p>${ep}</div>`;
$("#m").hidden=false;document.body.style.overflow="hidden";
}
function closeM(){$("#m").hidden=true;document.body.style.overflow=""}
function bar(){$("#pb i").style.width=pos/len*100+"%";$("#tm").textContent=fm(pos)+" / "+fm(len)}
function go(on){
clearInterval(timer);$("#pp").textContent=on?"⏸":"▶";$(".pl").classList.toggle("run",on);
if(on)timer=setInterval(()=>{pos=Math.min(len,pos+15);bar();if(pos>=len)go(false)},1000);
}
function play(i,ep){
const t=get(i);
len=t.s?(40+(i*7+(ep||1)*3)%15)*60:parseInt(t.l)*3600+(parseInt(t.l.split(" ")[1])||0)*60;
pos=0;$("#p").style.cssText="";$(".pl").style.cssText=hs(t);
$("#pt").textContent=t.n+(t.s?" · S1:E"+(ep||1):"");$("#pa").textContent=t.e;
const vi=(t.o.eps||[])[(ep||1)-1],pv=$("#pv"),hv=!!vi&&/^[0-9a-f]{32}$/.test(vi.v||"");
pv.hidden=!hv;$(".mid").hidden=hv;$("#dc").hidden=hv;
if(hv)pv.src="/_blob/"+vi.v;else pv.removeAttribute("src");
$("#m").hidden=true;$("#p").hidden=false;document.body.style.overflow="hidden";bar();
if(hv){go(false);pv.play().catch(()=>{})}else go(true);
}
function closeP(){go(false);const v=$("#pv");v.pause();v.removeAttribute("src");$("#p").hidden=true;document.body.style.overflow=""}
document.addEventListener("click",e=>{
const g=s=>e.target.closest(s);let x;
if(x=g("[data-v]")){$("#q").value="";$("#sw").classList.remove("open");view=x.dataset.v;render();scrollTo(0,0)}
else if(x=g("[data-play]"))play(+x.dataset.play,+x.dataset.ep)
else if(x=g("[data-id]"))openM(+x.dataset.id)
else if(x=g("[data-list]")){const i=+x.dataset.list,k=L.indexOf(i);k<0?L.push(i):L.splice(k,1);sv();x.textContent=k<0?"✓":"＋";x.classList.toggle("on",k<0);toast(k<0?"Added to My List":"Removed from My List");if(view==="list")render()}
else if(x=g("[data-like]")){x.classList.toggle("on");toast(x.classList.contains("on")?"Thanks, we will show you more like this":"Rating removed")}
else if(x=g(".arr")){const t=x.parentNode.querySelector(".track");t.scrollBy({left:(x.classList.contains("r")?1:-1)*t.clientWidth*.85,behavior:"smooth"})}
else if(g("[data-x]")||e.target.id==="m")closeM()
else if(g("[data-pc]"))closeP()
else if(g("#pp"))go(!$(".pl").classList.contains("run"))
else if(x=g("#pb")){const r=x.getBoundingClientRect();pos=Math.max(0,Math.min(len,(e.clientX-r.left)/r.width*len));bar()}
else if(g("[data-top]"))scrollTo({top:0,behavior:"smooth"});
});
$("#sb").onclick=()=>{const w=$("#sw");w.classList.toggle("open");if(w.classList.contains("open"))$("#q").focus()};
$("#q").oninput=e=>{const v=e.target.value.trim();if(v){if(view!=="search")prev=view;view="search"}else if(view==="search")view=prev;render()};
$("#av").onclick=()=>{$("#m .box").innerHTML=`<div class="ad"><button class="x" data-x aria-label="Close">✕</button><h2>Account</h2><p class="mut">Signed in as ${E(S)}</p><button class="btn w" data-so style="margin-top:14px">Sign out</button></div>`;$("#m").hidden=false;document.body.style.overflow="hidden"};
$("#si").onclick=()=>authForm("in");
acctUI();
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){const b=e.target.closest(".ad");const k=b&&b.querySelector("[data-alogin],[data-auth]");if(k)k.click()}});
addEventListener("scroll",()=>$("nav").classList.toggle("solid",scrollY>40));
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#a").hidden){$("#a").hidden=true;ok=false;document.body.style.overflow=""}else $("#p").hidden?closeM():closeP()}});
const COL=()=>db.collection("titles");
(async()=>{
try{const u=await claude.use("user");adm=u?await u.isOwner():false;uid=adm?await u.id():"";db=await claude.use("db");assets=await claude.use("assets")}catch(e){}
if(db)COL().onSnapshot(s=>{
const m=new Map(DEF.map(d=>[d.i,d]));
s.docs.forEach(x=>{const d=x.data();if(d)m.set(+x.id,{...d,i:+x.id})});
T=[...m.values()].filter(d=>!d.del).map(norm);
render();if($("#ab .ar"))panel();
},()=>{});
if(location.hash==="#admin")secret();
})();
let ck=0,ct;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const rnd=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,"0")).join("");
const AD=()=>db.collection("data/users/"+uid).doc("admin");
addEventListener("hashchange",()=>{if(location.hash==="#admin")secret()});
async function secret(){
if(!adm||!db||!uid)return;
if(ok){panel();$("#a").hidden=false;document.body.style.overflow="hidden";return}
try{const r=await AD().get();acct=r.exists?r.data():null}catch(e){return toast("Could not open. Try again.")}
$("#ab").innerHTML=`<button class="x" data-ax aria-label="Close">✕</button><h2>${acct?"Admin login":"Create admin password"}</h2><p class="mut">${acct?"Enter your admin password to continue.":"Choose a password with 6 or more characters. You will need it every time you open this panel."}</p><input id="ap" type="password" placeholder="Password" autocomplete="${acct?"current-password":"new-password"}">${acct?"":`<input id="ap2" type="password" placeholder="Repeat password" autocomplete="new-password">`}<button class="btn w" data-alogin>${acct?"Unlock":"Save password"}</button>`;
$("#a").hidden=false;document.body.style.overflow="hidden";
}
async function unlock(){
const p=$("#ap").value;
if(p.length<6)return toast("Use at least 6 characters");
if(!acct){
if(p!==$("#ap2").value)return toast("Passwords do not match");
const sl=rnd();
try{await AD().set({s:sl,h:await sha(sl+p)})}catch(e){return toast("Could not save password. Try again.")}
ok=true;panel();
}else if(await sha(acct.s+p)===acct.h){ok=true;panel()}
else toast("Wrong password");
}
function erow(e){return `<div class="er" data-v="${E(e.v||"")}"><input class="et" placeholder="Episode title" value="${E(e.t||"")}"><input class="ev" type="file" accept="video/*"><span class="mut">${e.v?"✓ video uploaded":"no video yet"}</span> <button data-rmep aria-label="Remove episode">✕</button></div>`}
function addEp(){$("#f_eps").insertAdjacentHTML("beforeend",erow({t:"Episode "+($("#f_eps").querySelectorAll(".er").length+1)}))}
function authForm(m){
$("#m .box").innerHTML=`<div class="ad"><button class="x" data-x aria-label="Close">✕</button><h2>${m==="in"?"Sign In":"Create account"}</h2><input id="le" type="email" placeholder="Email" autocomplete="email"><input id="lp" type="password" placeholder="Password" autocomplete="${m==="in"?"current-password":"new-password"}"><button class="btn w" data-auth="${m}">${m==="in"?"Sign In":"Sign Up"}</button><p class="mut" style="margin-top:14px">${m==="in"?"New to BINGEBOX?":"Already have an account?"} <button class="lk" data-mode="${m==="in"?"up":"in"}">${m==="in"?"Sign up now":"Sign in"}</button></p></div>`;
$("#m").hidden=false;document.body.style.overflow="hidden";
}
async function auth(m){
const e=$("#le").value.trim().toLowerCase(),p=$("#lp").value;
if(!/^\S+@\S+\.\S+$/.test(e))return toast("Enter a valid email");
if(p.length<6)return toast("Password must have 6 or more characters");
let U={};try{U=JSON.parse(localStorage.getItem("bbu")||"{}")}catch(x){}
if(m==="up"){if(U[e])return toast("Account exists. Please sign in");const sl=rnd();U[e]={s:sl,h:await sha(sl+p)}}
else if(!U[e]||U[e].h!==await sha(U[e].s+p))return toast("Wrong email or password");
try{localStorage.setItem("bbu",JSON.stringify(U));localStorage.setItem("bbs",e)}catch(x){return toast("Sign in is not available in this browser")}
S=e;loadL();closeM();acctUI();render();toast("Welcome, "+e.split("@")[0]);
}
function signOut(){S="";try{localStorage.removeItem("bbs")}catch(e){}loadL();closeM();acctUI();render();toast("Signed out")}
function acctUI(){$("#si").hidden=!!S;$("#av").hidden=!S;$("#av").textContent=S?S[0].toUpperCase():""}
function panel(){
$("#ab").innerHTML=`<button class="x" data-ax aria-label="Close">✕</button><h2>Admin panel</h2><button class="btn w" data-ed="new">＋ Add series</button><button class="btn w" data-ed="newm">＋ Add movie</button><button class="btn g" data-reset>Reset to starter titles</button><p class="mut" style="margin:10px 0 4px">${T.length} titles. Use Banner to feature a title at the top of Home.</p>`+T.map(t=>`<div class="ar">${t.p?`<img src="/_blob/${t.p}" alt="">`:"<i></i>"}<span>${t.n}${t.hero?" (banner)":""}</span><button data-ed="${t.i}">Edit</button><button data-hero="${t.i}">Banner</button><button data-del="${t.i}">Delete</button></div>`).join("");
}
function form(id){
const o=id[0]==="n"?{s:id!=="newm",e:"🎬",y:2026,r:"U/A 13+",g:"Drama",l:"1 Season",d:"",eps:[{t:"Episode 1"}]}:get(+id).o;
$("#ab").innerHTML=`<button class="x" data-ax aria-label="Close">✕</button><h2>${id[0]==="n"?"Add title":"Edit title"}</h2>
<label>Name<input id="f_n" value="${E(o.n)}"></label>
<div class="two"><label>Type<select id="f_s"><option value="1"${o.s?" selected":""}>Web series</option><option value="0"${o.s?"":" selected"}>Movie</option></select></label><label>Genre<input id="f_g" value="${E(o.g)}"></label>
<label>Year<input id="f_y" type="number" value="${E(o.y)}"></label><label>Rating<input id="f_r" value="${E(o.r)}"></label>
<label>Length (2h 10m or 3 Seasons)<input id="f_l" value="${E(o.l)}"></label><label>Emoji (used when no poster)<input id="f_e" value="${E(o.e)}"></label></div>
<label>Description<textarea id="f_d" rows="3">${E(o.d)}</textarea></label>
<label>Poster image from your device<input id="f_p" type="file" accept="image/*"></label>
<div id="f_eps"><h3>Episodes or video files</h3><p class="mut" style="margin-bottom:8px">Series: one row per episode. Movie: one row with the movie file. Videos up to 20 MB each. Upload only videos you own or have permission to use.</p>${(o.eps||[]).map(erow).join("")}</div><button class="btn g" data-addep>＋ Add episode</button><br>
<label><input id="f_t" type="checkbox"${o.tr?" checked":""} style="width:auto"> Show in Trending Now</label><br>
<button class="btn w" data-save="${id}">Save</button><button class="btn g" data-back>Cancel</button>`;
}
async function shrink(f){
const b=await createImageBitmap(f),k=Math.min(1,600/b.height),c=document.createElement("canvas");
c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
return new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}
async function save(id){
const g=k=>$("#f_"+k).value.trim(),n=g("n");
if(!n)return toast("Please enter a name");
const o=id[0]==="n"?{i:Date.now(),a:Math.floor(Math.random()*360),b:Math.floor(Math.random()*360)}:{...get(+id).o};
Object.assign(o,{n,s:g("s")==="1",g:g("g"),y:+g("y")||2026,r:g("r"),l:g("l"),e:g("e")||"🎬",d:g("d"),tr:$("#f_t").checked});
const f=$("#f_p").files[0];
if(f){
if(!assets)return toast("Poster upload needs editor access");
try{toast("Uploading poster…");o.p=(await assets.upload(await shrink(f))).id}catch(e){return toast("Poster upload failed. Try a smaller image.")}
}
const es=[];let q=0;
for(const r of document.querySelectorAll("#f_eps .er")){
q++;const fv=r.querySelector(".ev").files[0];let v=r.dataset.v||"";
if(fv){
if(!assets)return toast("Video upload needs owner access");
if(fv.size>20*1048576)return toast("Each video must be under 20 MB");
try{toast("Uploading video "+q+"…");v=(await assets.upload(fv)).id}catch(e){return toast("Video upload failed. Try again.")}
}
es.push({t:r.querySelector(".et").value.trim(),v});
}
o.eps=es;
try{await COL().doc(String(o.i)).set(o);toast("Saved");panel()}catch(e){toast("Could not save. Try again.")}
}
async function setHero(id){
const w=(t,h)=>COL().doc(String(t.i)).set({...t.o,i:t.i,hero:h});
try{for(const t of T)if(t.hero&&t.i!==id)await w(t,false);await w(get(id),true);toast("Banner updated")}catch(e){toast("Could not save. Try again.")}
}
async function del(id){try{await COL().doc(String(id)).set({i:id,del:true});toast("Deleted")}catch(e){toast("Could not delete. Try again.")}}
async function reset(){try{const s=await COL().get();await Promise.all(s.docs.map(d=>COL().doc(d.id).delete()));toast("Starter titles restored")}catch(e){toast("Could not reset. Try again.")}}
document.addEventListener("click",e=>{
const g=s=>e.target.closest(s);let x;
if(g("[data-ax]")||e.target.id==="a"){$("#a").hidden=true;ok=false;document.body.style.overflow=""}
else if(x=g("[data-ed]"))form(x.dataset.ed)
else if(x=g("[data-hero]"))setHero(+x.dataset.hero)
else if(x=g("[data-del]")){if(x.textContent!=="Confirm?")x.textContent="Confirm?";else del(+x.dataset.del)}
else if(x=g("[data-save]"))save(x.dataset.save)
else if(g("[data-back]"))panel()
else if(g("[data-alogin]"))unlock()
else if(x=g("[data-auth]"))auth(x.dataset.auth)
else if(x=g("[data-mode]"))authForm(x.dataset.mode)
else if(g("[data-so]"))signOut()
else if(g("[data-addep]"))addEp()
else if(x=g("[data-rmep]"))x.closest(".er").remove()
else if(g(".logo")){ck++;clearTimeout(ct);ct=setTimeout(()=>ck=0,2500);if(ck>=5){ck=0;secret()}}
else if(x=g("[data-reset]")){if(x.textContent!=="Sure?")x.textContent="Sure?";else reset()}
});
render();
</script>
